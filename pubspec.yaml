name: ie_koto
description: "家のあれやらなきゃを、忘れない。家族で使う、家のやることリスト。Android向けMVP。"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 同期（docs/SYNC_DESIGN.md §3）。Android でも Web でも同じコードで送受信するため。
  http: ^1.6.0

  # 保存（docs/SYNC_DESIGN.md §9 の手順1）。Android は SharedPreferences、Web は localStorage。
  shared_preferences: ^2.5.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
